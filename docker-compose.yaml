services:
  database:
    image: postgres:16-alpine
    container_name: gamestradein-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gamestradein-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    container_name: gamestradein-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT}:5000"
    volumes:
      - ./backend:/app
    working_dir: /app/GamesTradeIn.API
    command: dotnet watch run --urls http://+:5000
    networks:
      - gamestradein-network
    depends_on:
      database:
        condition: service_healthy

  frontend-pwa:
    image: node:26-alpine
    container_name: gamestradein-pwa
    ports:
      - "${VITE_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:${API_PORT}
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - gamestradein-network
    depends_on:
      - backend-api

volumes:
  postgres_data:

networks:
  gamestradein-network:
    driver: bridge